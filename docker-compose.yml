# Copy .env.example to .env, set AUTH_TOKENS (and COMFYUI_URL if ComfyUI is not on this machine),
# then: docker compose up -d
services:
  comfy:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Reach a ComfyUI running on the Docker host by default.
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      # The container listens on the network, so it must not run without authentication.
      AUTH_MODE: ${AUTH_MODE:-token}
      AUTH_TOKENS: ${AUTH_TOKENS:?Set AUTH_TOKENS, e.g. me=a-long-random-secret}
      COMFYUI_CLEANUP_TOKEN: ${COMFYUI_CLEANUP_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - comfy-data:/data
      # Add your own workflows by mounting a folder of workflow folders:
      # - ./my-workflows:/app/workflows
    restart: unless-stopped

volumes:
  comfy-data:
